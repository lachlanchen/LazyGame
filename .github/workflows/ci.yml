name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package:smoke
      - run: npm pack --dry-run --workspace @lazyingart/game-core
      - run: npm pack --dry-run --workspace @lazyingart/game-react
      - run: npm audit --audit-level=high
      - run: bash -n scripts/*.sh scripts/tests/*.sh
      - run: scripts/tests/test-runtime-safety.sh
      - run: node --check scripts/browser-smoke.mjs
      - run: git diff --check
